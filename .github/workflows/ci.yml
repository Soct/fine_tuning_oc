name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install API project
        run: uv sync --project deployment --group dev

      - name: Import check
        run: uv run --project deployment --group dev python -m compileall app tests

      - name: Run tests
        run: uv run --project deployment --group dev pytest tests/ -q

      - name: Build Docker image
        run: docker build -t fine-tuning-oc-api:ci .

  deploy:
    needs: api
    runs-on: ubuntu-latest
    environment: GCP
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    env:
      GCP_REGION: europe-west1
      GAR_REPOSITORY: fine-tuning-oc
      GAR_IMAGE: api

    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SA_EMAIL }}'
          token_format: 'access_token'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check Artifact Registry access
        run: |
          gcloud services describe artifactregistry.googleapis.com \
            --project "${{ secrets.GCP_PROJECT }}" \
            --format='value(state)'

          gcloud artifacts repositories describe "$GAR_REPOSITORY" \
            --location "$GCP_REGION" \
            --project "${{ secrets.GCP_PROJECT }}"

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        run: |
          docker build -t $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/$GAR_REPOSITORY/$GAR_IMAGE:${{ github.sha }} .
          docker push $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/$GAR_REPOSITORY/$GAR_IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fine-tuning-oc-api \
            --image $GCP_REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/$GAR_REPOSITORY/$GAR_IMAGE:${{ github.sha }} \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "INFERENCE_BACKEND=vllm,MODEL_ID=${{ secrets.MODEL_ID }},VLLM_BASE_URL=${{ secrets.VLLM_BASE_URL }}"