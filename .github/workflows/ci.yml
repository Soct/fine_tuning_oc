name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install API project
        run: uv sync --project deployment --group dev

      - name: Import check
        run: uv run --project deployment --group dev python -m compileall app tests

      - name: Run tests
        run: uv run --project deployment --group dev pytest -q

      - name: Build Docker image
        run: docker build -t fine-tuning-oc-api:ci .
