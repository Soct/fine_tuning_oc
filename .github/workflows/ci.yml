name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install API project
        run: uv sync --project deployment --group dev

      - name: Import check
        run: uv run --project deployment --group dev python -m compileall app tests

      - name: Run tests
        run: uv run --project deployment --group dev pytest tests/ -q

      - name: Build Docker image
        run: docker build -t fine-tuning-oc-api:ci .

  deploy:
    needs: api
    runs-on: ubuntu-latest
    environment: GCP
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SA_EMAIL }}'

      - name: Build and Push Docker Image
        run: |
          # 1. Configurer Docker pour utiliser les credentials générés par l'étape auth
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          
          # 2. Build manuel de l'image
          docker build -t europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/fine-tuning-oc/api:${{ github.sha }} .
          
          # 3. Push manuel vers Artifact Registry
          docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/fine-tuning-oc/api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fine-tuning-oc-api \
            --image europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/fine-tuning-oc/api:${{ github.sha }} \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "INFERENCE_BACKEND=vllm,MODEL_ID=${{ secrets.MODEL_ID }},VLLM_BASE_URL=${{ secrets.VLLM_BASE_URL }}"